name: Verify

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Backend, Desktop, Docker & E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16389'
      REDIS_URL: redis://127.0.0.1:16389

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 16389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install backend and desktop dependencies
        run: |
          npm ci
          npm ci --prefix apps/desktop

      - name: Verify Redis connectivity
        run: |
          docker ps -a
          docker exec ${{ job.services.redis.id }} redis-cli ping

      - name: Check artifacts, version sync, and updater script syntax
        run: |
          npm run check:artifacts
          npm run version:check
          node --check scripts/test-updater.cjs

      - name: Build and lint backend
        run: |
          npm run build
          npm run lint

      - name: Run backend unit tests
        run: npm test -- --runInBand

      - name: Lint, test, and build desktop UI
        run: |
          npm --prefix apps/desktop run lint
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build

      - name: Run Redis, campaign, and control integration tests
        run: |
          npm run test:redis
          REDIS_TEST_URL=redis://127.0.0.1:16389/3 npm run test:campaigns
          REDIS_TEST_URL=redis://127.0.0.1:16389/5 npm run test:control

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build and verify Linux worker binary
        run: |
          node scripts/build-workers.cjs --host
          node scripts/sign-release.cjs
          node scripts/release-verify.cjs

      - name: Run Linux Updater E2E Test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:16389/4
        run: node scripts/test-updater.cjs

      - name: Build production Docker image
        run: docker build --platform linux/amd64 -t trafficbot:ci .

      # The Docker runtime supplies a supported Chromium sandbox.
      # Never disable the Chromium sandbox for CI.
      - name: Run browser and lifecycle integration tests
        run: |
          docker run --rm --init \
            --cap-add=SYS_ADMIN \
            --network=host \
            --user root \
            -v "$PWD:/tests" \
            --entrypoint sh \
            trafficbot:ci -c '
              cp -R /tests /verification
              chown -R node:node /verification
              cd /verification
              su node -s /bin/sh -c "npm run test:browser && npm run test:lifecycle"
            '

      - name: Audit production dependencies (advisory report)
        run: npm audit --omit=dev --json > audit-runtime.json || true

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-dependency-audit
          path: audit-runtime.json

  windows:
    name: Windows (Unit & Updater E2E)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start Redis-compatible server on Windows
        shell: pwsh
        run: |
          choco install memurai-developer --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Memurai installation failed' }
          Start-Service Memurai
          node scripts/wait-for-redis.cjs

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Windows worker binary
        run: node scripts/build-workers.cjs --host

      - name: Run Windows Updater E2E Test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/4
        run: node scripts/test-updater.cjs

  macos:
    name: macOS (Unit & Updater E2E)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:16389
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start Redis on macOS
        run: |
          brew install redis
          redis-server --bind 127.0.0.1 --port 16389 --save '' --appendonly no --daemonize yes
          node scripts/wait-for-redis.cjs

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build macOS worker binary
        run: node scripts/build-workers.cjs --host

      - name: Run macOS Updater E2E Test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:16389/4
        run: node scripts/test-updater.cjs
