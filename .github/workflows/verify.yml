
name: Verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16389'
      REDIS_URL: redis://127.0.0.1:16389

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 16389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Redis connectivity
        run: |
          docker ps -a
          docker exec ${{ job.services.redis.id }} redis-cli ping

      - name: Check generated artifacts
        run: npm run check:artifacts

      - name: Build project
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run Redis integration tests
        run: npm run test:redis
      - name: Verify campaign concurrency and dispatch recovery
        run: REDIS_TEST_URL=redis://127.0.0.1:16389/3 npm run test:campaigns

      - name: Setup Bun for E2E
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Linux Worker Binary
        run: node scripts/build-workers.cjs

      - name: Run Linux Updater E2E Test
        run: node scripts/test-updater.cjs

      # Build the application using its production Dockerfile.
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t trafficbot:ci .

      # The Docker runtime supplies a supported Chromium sandbox.
      # Never disable the Chromium sandbox for CI.
      - name: Run browser and lifecycle tests
        run: |
          docker run --rm --init \
            --cap-add=SYS_ADMIN \
            --network=host \
            --user root \
            -v "$PWD:/tests" \
            --entrypoint sh \
            trafficbot:ci -c '
              cp -R /tests /verification
              chown -R node:node /verification
              cd /verification
              su node -s /bin/sh -c "npm run test:browser && npm run test:lifecycle"
            '

      - name: Audit production dependencies
        run: npm audit --omit=dev --json > audit-runtime.json
        continue-on-error: true

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-dependency-audit
          path: audit-runtime.json

  windows-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Start Redis on Windows
        uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: 6

      - name: Build Windows Worker Binary
        run: node scripts/build-workers.cjs

      - name: Run Windows Updater E2E Test
        run: node scripts/test-updater.cjs

  macos-verify:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Start Redis on macOS
        uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: 6

      - name: Build macOS Worker Binary
        run: node scripts/build-workers.cjs

      - name: Run macOS Updater E2E Test
        run: node scripts/test-updater.cjs
