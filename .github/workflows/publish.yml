name: Release and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please & npm Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Release Please
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      - name: Check if current package version needs publishing
        id: check_npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@lucasveneno/trafficbot@$VERSION" version >/dev/null 2>&1; then
            echo "Already published @lucasveneno/trafficbot@$VERSION on npm."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is not yet on npm; preparing publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release.outputs.release_created == 'true' || steps.check_npm.outputs.should_publish == 'true'
        run: npm ci

      - name: Verify version synchronization and build
        if: steps.release.outputs.release_created == 'true' || steps.check_npm.outputs.should_publish == 'true'
        run: |
          npm run version:check
          npm run build

      - name: Publish to npm
        if: steps.release.outputs.release_created == 'true' || steps.check_npm.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
